[project]
name = "goi-controller"
version = "0.1.0"
description = "Stick controller bridge for Getting Over It (ESP32 IMU + optional camera)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []          # the IMU path needs nothing beyond the standard library

[project.optional-dependencies]
camera  = ["mediapipe==0.10.9", "opencv-python>=4.8"]   # mediapipe 0.10.9 wheels: Python <= 3.11
hotkeys = ["pynput>=1.7"]

[project.scripts]
goi-bridge  = "goi_bridge.cli:main"
goi-monitor = "goi_bridge.monitor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goi_bridge"]
